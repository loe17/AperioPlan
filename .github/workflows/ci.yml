name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Server, Web & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aperio
          POSTGRES_PASSWORD: aperio
          POSTGRES_DB: aperio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aperio" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aperio:aperio@localhost:5432/aperio_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  cad-bridge:
    name: CAD-Wächter (Core + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build cad-bridge/src/AperioPlan.Cli/AperioPlan.Cli.csproj -c Release

  docker:
    name: Docker-Abbild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aperioplan:ci
